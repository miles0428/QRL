# CNN+VQC A2C on DinoRun-v0
# Architecture: NatureCNNEncoder → shared VQC → actor VQC + critic VQC
# Smoke test: 10 episodes / 300s wall clock

runtime:
  experiment_name: dino_cnn_a2c
  seed: 0
  device: cpu
  precision: float32
  output_dir: result/

env:
  id: DinoRun-v0
  params: {}

model:
  type: cnn_a2c
  encoder: cnn
  head: policy
  hidden: 256
  vqc:
    n_qubits: 6
    n_layers: 3
    reuploading: true
    observable: zz
    entangler: cx

trainer:
  algorithm: a2c
  hyperparams:
    max_episodes: 5000
    max_wall_clock_s: 3600
    gamma: 0.99
    gae_lambda: 0.95
    entropy_coef: 0.01
    value_coef: 0.5
    max_grad_norm: 0.5
    max_steps_per_episode: 2000
    n_envs: 1
    steps_per_update: 1
    baseline: batch_mean
    normalize_advantages: true
    eval_every: 0
    eval_episodes: 10
    solve_threshold: 475.0
    solve_window: 100
  optimizer:
    lr: 0.001
    amsgrad: true
