# A2Q: CLASSICAL actor + QUANTUM critic, A2C + GAE.
#
# One cell of the actor/critic grid in Koelle et al. 2024 (arXiv:2401.07043) --
# first letter actor, second critic. See configs/q2c.yaml for the full framing
# and for how our ansatz differs from theirs.
#
# This is the cell that isolates the CRITIC. Everything the quantum model
# contributes here goes into estimating V(s); the policy being improved is a
# plain MLP. Read against configs/mlp_a2c.yaml it answers one question directly:
# does a quantum value function help, hurt, or do nothing, holding the actor
# fixed?
#
# Our prior is that this is the weaker of the two mixed cells, and the reasoning
# is worth stating so the result can contradict it. A critic has ~60 gradient
# steps to learn a function reaching V* ~ 99, and in the qa2c runs the quantum
# critic reached explained_variance ~0.6 -- useful but not excellent. A classical
# critic on the same budget is close to exact. So the quantum circuit is being
# asked to do the job it is worst placed to do, on the tighter deadline.
#
# Four-layer layout (BLUEPRINT §6.1): runtime / env / model / trainer.
runtime:
  experiment_name: a2q
  seed: 0
  device: cpu
  precision: float32
  output_dir: result/

env:
  id: CartPole-v1
  params: {}

model:
  type: a2q
  encoder: mlp
  head: policy
  # classical actor: 7*6 + 2 = 44 params, vs VQCPolicy's 45
  hidden: 6
  vqc:
    # Circuit settings below apply to the CRITIC only, and are identical to
    # configs/qa2c.yaml's so the two are comparable.
    n_qubits: 4
    n_layers: 5
    reuploading: true
    output_rescaling: true
    critic_observable: "ZZZZ"

trainer:
  algorithm: a2c
  hyperparams:
    max_episodes: 5000
    gamma: 0.99
    n_envs: 8
    episodes_per_update: 16
    gae_lambda: 0.95
    normalize_advantages: true
    value_coef: 0.5
    value_loss_fn: huber
    entropy_coef: 0.0
    max_grad_norm: 1.0
    max_steps_per_episode: 500
    eval_every: 50
    eval_episodes: 5
    final_eval_episodes: 100
    solve_threshold: 475.0
    solve_window: 100
  optimizer:
    lr: 0.01                          # classical actor
    lr_critic_vqc: 0.01               # critic circuit weights
    lr_critic_lam: 0.01               # critic input scaling
    lr_critic_w: 0.1                  # critic output scaling -- must reach ~V* = 99
    amsgrad: true
    gradient_method: adjoint
    backend: torch_sv