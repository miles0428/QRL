[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-spin-cartpole"
version = "0.1.0"
description = "Quantum Spin-CartPole: a Gymnasium environment for SU(2) spin-1/2 control"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    { name = "YC", email = "yc@example.com" }
]
keywords = ["quantum", "reinforcement-learning", "gymnasium", "spin", "qutip"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "qutip",
    "gymnasium==0.29.1",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/your-repo/quantum-spin-cartpole"
Source = "https://github.com/your-repo/quantum-spin-cartpole"

[project.entry-points]
gymnasium.env = "quantum_spin_cartpole:QuantumSpinCartPoleEnv"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",  # suppress qutip deprecation noise
]
